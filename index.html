<!DOCTYPE html>

<style>
:root{--bg:#fbf6ef;--sand:#f6ece0;--card:#fff;--ink:#1d2b36;--muted:#6b5e52;--line:#ead9c4;--brand:#b44d22;--brand-d:#9c3f1b;--green:#1f5f4f;--r:16px;--shadow:0 1px 2px rgba(60,40,20,.06),0 6px 20px rgba(60,40,20,.07);--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--head:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font:17px/1.6 var(--sans);color:var(--ink);background:var(--bg);display:flex;flex-direction:column}
.wrap{max-width:640px;margin:auto;padding:48px 20px;text-align:center}
h1{font:800 clamp(2rem,6vw,2.75rem)/1.15 var(--head);letter-spacing:-.02em;margin:0 0 .35em}
h1 b{color:var(--brand)}
.tagline{font:700 clamp(1.1rem,3vw,1.35rem)/1.3 var(--head);color:var(--green);margin:0 0 1.2em}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 24px;box-shadow:var(--shadow);text-align:left}
.card p{margin:0 0 .8em;color:#3c3a36}.card p:last-child{margin:0;color:var(--muted);font-size:1rem}
.pill{display:inline-block;font-size:.94rem;font-weight:700;color:var(--green);background:#e8f1ec;border-radius:99px;padding:4px 12px;margin-bottom:18px}
footer{padding:24px;text-align:center;color:var(--muted);font-size:.95rem}
</style>
</head>
<body>
<main class="wrap">
<span class="pill">Binnenkort</span>
<h1>Verduurzaam<b>Match</b>.nl</h1>
<p class="tagline">Verduurzamen? Gewoon. Zonder gedoe.</p>
<div class="card">
<p>We bouwen hier een heldere match-site, in dezelfde stijl als BoekhoudMatch: kort, warm en te vertrouwen.</p>
<p>Nog even geduld — de echte inhoud volgt zodra het voorbeeld klaar is.</p>
</div>
</main>
<footer>© 2026 VerduurzaamMatch.nl</footer>
</body>
